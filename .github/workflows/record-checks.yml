# Record-contract and decision-log gates for this repo.
#
# Same shape of gap as requirement-checks.yml: these scripts already existed in
# goatindex/claude-workflow and already ran clean or close to it, but nothing invoked
# them here except a person remembering to. Audited 2026-09-20 alongside the ba-issue
# corruption fix (see NEXT.md) rather than left as more capable-but-unenforced checks.
#
# disposal_check / provenance_check / record_index pass clean today, so they run
# blocking. decision_lint and standing_check found real pre-existing gaps (5 decisions
# missing a required field; 12 requirements with no verification-status) that this
# workflow does not invent values to paper over - they run non-blocking (report only)
# until that data is fixed and someone flips continue-on-error to false.
name: record-checks

on:
  pull_request:
    paths:
      - "DECISIONS.md"
      - "requirements/**"
      - "work-packages/**"

permissions:
  contents: read

jobs:
  check:
    name: decision + record contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decision log format (blocking is deferred - see header)
        continue-on-error: true
        run: python3 scripts/decision_lint.py --file DECISIONS.md

      - name: Record index (enumerates every record type; informational)
        run: python3 scripts/record_index.py --root .

      - name: Standing check (blocking is deferred - see header)
        continue-on-error: true
        run: python3 scripts/standing_check.py --root .

      - name: Provenance check (every citation that claims to resolve, does)
        run: python3 scripts/provenance_check.py --set requirements --resolve-root .

      - name: Disposal check (no record vanishes between base and head)
        run: python3 scripts/disposal_check.py --repo . --base origin/main --head WORKTREE
