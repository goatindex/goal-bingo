# Record-contract and decision-log gates for this repo.
#
# Same shape of gap as requirement-checks.yml: these scripts already existed in
# goatindex/claude-workflow and already ran clean or close to it, but nothing invoked
# them here except a person remembering to. Audited 2026-09-20 alongside the ba-issue
# corruption fix (see NEXT.md) rather than left as more capable-but-unenforced checks.
#
# decision_lint and standing_check ran non-blocking at first (5 decisions missing a
# required field; 12 requirements with no verification-status) rather than invent
# values to paper over gaps the workflow didn't create. Both gaps are fixed and both
# checks verified clean (55/55 decisions, 140/140 records) as of 2026-09-21 -
# all five checks now block.
#
# citation_check.py (2026-09-22) is check 5 for prose: every #N in NEXT.md, DECISIONS.md,
# README.md and STATE.md exists, and a sentence claiming merged / open / closed is judged
# against the live state - outside `## Done (...)` and `## D-...` log sections, where the
# claim was true on the day. Roughly half of the adversarial reviewer's blocking findings
# over this repo's first 97 pull requests were exactly that shape, found by an agent
# reading prose at turn cost.
name: record-checks

on:
  pull_request:
    paths:
      - "DECISIONS.md"
      - "requirements/**"
      - "work-packages/**"
      - "NEXT.md"
      - "README.md"
      - "STATE.md"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    name: decision + record contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decision log format
        run: python3 scripts/decision_lint.py --file DECISIONS.md

      - name: Record index (enumerates every record type; informational)
        run: python3 scripts/record_index.py --root .

      - name: Standing check
        run: python3 scripts/standing_check.py --root .

      - name: Provenance check (every citation that claims to resolve, does)
        run: python3 scripts/provenance_check.py --set requirements --resolve-root .

      - name: Disposal check (no record vanishes between base and head)
        run: python3 scripts/disposal_check.py --repo . --base origin/main --head WORKTREE

      # GITHUB_TOKEN sees this repository only; a citation into a private sibling repo
      # is reported as NOAUTH - named, unverified, not failed - rather than red.
      - name: Citations resolve and state claims hold (#N in prose)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/citation_check.py --auth-errors-are-skips
