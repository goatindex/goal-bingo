# The app's typecheck and unit tests, on every pull request.
#
# Until 2026-09-22 nothing in CI ran `tsc` or `vitest`. Ninety-seven pull requests
# landed with "N/N tests pass" in their bodies and NEXT.md, and the adversarial
# reviewer said twice that it could not verify any of them - it had no sandbox to run
# the suite in and no workflow to point at. Every test claim rested on the author's
# word, at the cost of agent turns spent trying. This is the mechanical gate under
# those claims (D-2026-09-22-1): the reviewer workflow now refuses a deep-tier review
# in a repository that has no such gate.
#
# The suite-ran guard is deliberate. Vitest exits 0 when it collects nothing only if
# passWithNoTests is set, but a misconfigured include glob could still collect a
# handful and look green. Zero tests is the failure this estate keeps finding (F-40):
# absence read as success.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=.vitest/ci.json

      - name: The suite ran something
        run: |
          node -e '
            const r = require("./.vitest/ci.json");
            console.log("vitest ran " + r.numTotalTests + " tests, " + r.numFailedTests + " failed");
            if (r.numTotalTests === 0) { console.log("zero tests collected - refusing to pass"); process.exit(1); }
          '

      # Every figure prose states as true now (the test count, for a start) agrees
      # with the command that measures it. figures.txt is this repo's registry; the
      # engine is a generated copy from goatindex/claude-workflow. Runs here because
      # measuring needs the installed app.
      - name: Headline figures match measured values
        working-directory: .
        run: python3 scripts/figures_check.py --registry figures.txt --root .
