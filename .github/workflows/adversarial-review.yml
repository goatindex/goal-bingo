# Adversarial review of every pull request.
#
# GENERATED COPY in consuming repositories - master is
# goatindex/claude-workflow, skills/adversarial-review/workflows/adversarial-review.yml
#
# Trace-chain link 6 has two halves: automated checks and an agent review. Until
# 2026-09-08 the review half existed in one repository, while CHAIN.md marked link 6
# "working in four" on the strength of branch-and-PR alone.
#
# The reviewer is advisory and the merge is human, always. The moment review and merge
# share an author the review is theatre - which is exactly what fifteen pull requests on
# 2026-09-08 were.
#
# This workflow holds no repository-specific convention. It reads the repo's own
# CLAUDE.md, so one master serves every consumer (TB-20).
#
# Package B: path-based tiers (mechanical / lite / standard / deep). Mechanical
# syncs of generated copies skip the Claude agent so reviewer-yml PRs no longer
# need GUARD_ALLOW_UNREVIEWED=1.
name: adversarial-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write        # gh pr comment posts through the issues API; read-only denies it silently
  id-token: write

jobs:
  review:
    name: adversarial review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A synchronize while a review is still running cancels the predecessor. Cost
    # compounds with round count, not diff size (goal-bingo#40); finishing a stale
    # review of a superseded HEAD wastes the turn budget and confuses the gate.
    concurrency:
      group: adversarial-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify review tier
        id: classify
        run: |
          set -e
          # Prefer the vendored copy; fall back to the skill path on the master repo
          # before the copy is refreshed.
          CLASSIFY=scripts/classify_review_tier.py
          if [ ! -f "$CLASSIFY" ]; then
            CLASSIFY=skills/adversarial-review/scripts/classify_review_tier.py
          fi
          python3 "$CLASSIFY" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --copies copies.txt \
            --github-output

      - name: Check the reviewer can run
        if: steps.classify.outputs.tier != 'mechanical'
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN. The adversarial reviewer cannot run."
            echo "This is a failure, not a skip: an unreviewed pull request is not a"
            echo "reviewed one, and treating an absent review as a pass is the exact"
            echo "failure mode this review exists to catch."
            exit 1
          fi

      # Recorded before review so the verification step can require a comment
      # posted during *this* run, not a stale one from an earlier round.
      - name: Record run start
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Package B mechanical: generated-copy / reviewer-yml syncs. Skip Claude
      # entirely so claude-code-action's "workflow validation skip" never fires
      # and GUARD_ALLOW_UNREVIEWED is not required for ordinary sync PRs.
      - name: Mechanical review
        if: steps.classify.outputs.tier == 'mechanical'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          if [ -f copies.txt ] && [ -f scripts/refresh_copies.py ]; then
            echo "Running refresh_copies.py --check"
            python3 scripts/refresh_copies.py --check
          else
            echo "No copies.txt / refresh_copies.py; skipping drift check"
          fi
          {
            echo "## Adversarial review (mechanical)"
            echo
            echo "Package B mechanical tier: every changed path is \`adversarial-review.yml\`"
            echo "and/or a destination listed in \`copies.txt\`. No Claude agent run."
            echo
            echo "- copies drift check: ran when \`scripts/refresh_copies.py\` was present"
            echo "- human still merges; this comment satisfies the this-run review gate"
            echo
            echo "**Verdict:** 0 blocking findings from the mechanical path. I would merge"
            echo "after confirming the sync is intentional."
            echo
            echo "Reviewed-Commit: ${HEAD_SHA}"
          } | gh pr comment "$PR" --body-file -

      - name: Agent review
        if: steps.classify.outputs.tier != 'mechanical'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOT use_sticky_comment: true. This workflow supplies an explicit
          # `prompt:`, which the action auto-detects as "agent mode" - and agent
          # mode sets claudeCommentId to undefined unconditionally, by design
          # ("No tracking comment in agent mode", anthropics/claude-code-action
          # src/modes/agent/index.ts). use_sticky_comment is a silent no-op here,
          # and mcp__github_comment__update_claude_comment cannot ever succeed
          # under this trigger - not intermittently, structurally. Confirmed
          # 2026-09-20 by isolating a stuck PR's own content in a throwaway
          # duplicate: identical diff, fresh PR number, same tool still errored
          # with "CLAUDE_COMMENT_ID environment variable is required".
          #
          # Without this allowedTools line the agent is denied every tool it
          # needs. A run on 2026-09-08 took 48 turns and $1.11, was denied 11
          # times, posted nothing, and the action still reported success.
          # Naming the tools in the prompt does not grant them.
          #
          # --max-turns from Package B classify (30 lite / 75 standard|deep).
          # Package A: concurrency cancel, delta re-review, Reviewed-Commit
          # trailers. Bash(python3:*) for claim checks (goal-bingo#40 round 4).
          claude_args: |
            --model sonnet
            --max-turns ${{ steps.classify.outputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(python3:*)"
          prompt: |
            You are the adversarial reviewer for ${{ github.repository }}. Review
            PR #${{ github.event.pull_request.number }}.

            Review tier: ${{ steps.classify.outputs.tier }}
            (Package B — intensity from changed paths. Do not reclassify.)

            Tier rules:
            - lite: only Part 1 item 4 (claims in prose) and Part 2 (documentation
              currency). Do not hunt for tests, CI gates, or failure modes 1–3.
              Stay on the changed files. Keep the review short.
            - standard: full review below. Documentation-only diffs still skip
              Part 1 items 1–3 as written under Part 1.
            - deep: full review below, and run Part 1 items 1–3 even if the diff
              looks small — product/test/CI paths are in scope.

            Ground rules:
            - Advisory only. Never approve, request changes, push commits, or edit files.
              Your entire output is comments. The human merges.
            - Do not duplicate the mechanical gates. Read `.github/workflows/` to see what
              already runs, and skip what it covers.
            - Read this repository's CLAUDE.md and hold the diff to its conventions. Do not
              apply conventions from other repositories.
            - Always post the summary comment, even with zero findings. A clean pull request
              still gets a verdict. If a tool call is denied, do not retry it - continue and
              still post the summary.
            - Only report findings that survive scrutiny. A short review of real findings
              beats a long review of maybes.
            - Use `python3` only to verify claims against the worktree (counts, regex or
              round-trip checks). Never write or modify files with it.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and
            `gh pr view`. Also read prior top-level review summaries on the PR (comments
            whose body starts with `## Adversarial review` or `## Review summary`).

            ### Incremental re-review (Package A)

            If a prior summary contains a `Reviewed-Commit: <sha>` trailer, this is a
            re-review of a synchronize, not a first pass:
            - Scope the diff to commits/files since that SHA (`git diff <sha>...HEAD` /
              the files those commits touch). If the trailer is missing or the SHA is
              not an ancestor, fall back to a full review.
            - Re-check only: (a) files changed since that SHA, (b) previously **blocking**
              findings that are still open, (c) new prose claims in the new commits.
            - Do **not** re-derive estate-wide counts, byte audits, or already-closed
              findings unless those files changed.

            If there is no prior `Reviewed-Commit:` trailer, do a full review (including
            the documentation-only Part 1 skip below, unless tier is deep).

            Post inline findings with
            mcp__github_inline_comment__create_inline_comment.

            Post the summary as a top-level PR comment with `gh pr comment`, using a
            bash heredoc with a **quoted**, distinctive delimiter so nothing in the
            summary text (backticks, `$variables`, quotes) is ever reinterpreted by the
            shell, and a stray line that happens to read "EOF" in a generated summary
            can't silently truncate it:
            ```
            gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'CLAUDE_REVIEW_SUMMARY_EOF'
            <your summary here>
            CLAUDE_REVIEW_SUMMARY_EOF
            ```
            Never build the body as an inline `--body "..."` string, and never use
            `echo`/`printf` to assemble it - both re-interpret exactly the characters
            Conventional Comments and code spans are full of.

            Format every finding as a Conventional Comment: "label (decoration): subject"
            then the discussion. Labels: praise, nitpick, suggestion, issue, todo, question,
            thought, note. Decorations: (blocking), (non-blocking), (if-minor).

            ## Part 1 - the four failure modes this review exists for

            These are not hypothetical. Each cost real defects in this estate and each
            passed CI, tests and a human read.

            **Before reading further:**
            - If Review tier is **lite**, skip items 1, 2, and 3. Jump to item 4 and Part 2.
            - If Review tier is **deep**, run items 1–3 even on a small diff.
            - Otherwise: if the diff is documentation-only (only markdown, prose, or
              config files — no source code, no test files, no workflow files), skip items
              1, 2, and 3 below entirely. Jump straight to item 4 and then Part 2. Items
              1–3 require code or tests to exist; spending turns looking for them in a
              documentation diff wastes the turn budget on nothing.

            1. **A test that restates the implementation's assumption instead of reading
               the source of truth.** Where a test and the code both name the same literal -
               a string key, an output format, a schema field, a section name - ask where
               that literal comes from and whether the test derives it or repeats it. A test
               written from the same belief as the code can only confirm that belief.
               Real case: a checker keyed on the purpose string "sweep" while the writer
               emitted "correlation-sweep", with a fixture that seeded "sweep" too. A
               breached bound was reported with no verdict at all.

            2. **Absence read as success.** A grep that matches nothing, a discovery run
               that finds no tests, a query returning no rows, a loop over an empty list -
               each exits 0 and looks like a pass. Ask of every new check: what does it do
               when it finds nothing, and is that distinguishable from finding nothing
               wrong? Real case: a CI step named "Copies match their masters" that ran
               `grep -l` and passed on a hand-edited copy.

            3. **A gate that cannot fail.** Read every added CI step and assertion and ask
               what input would make it red. If you cannot construct one, say so as
               issue (blocking). Real case: a test-discovery workflow that reported six
               suites and zero tests as success.

            4. **A claim in prose that the diff does not support.** Commit messages,
               README changes and status tables in this estate carry claims like "verified",
               "covered", "all four checks pass". Check each against the diff. Counting a
               mention as the thing is a recurring defect here.

            ## Part 2 - documentation, per C8-2

            Ways of working requires that work carrying a documentation obligation updates
            it in the same pull request, reviewed independently, and that this is blocking.

            - Does this change alter what a reader of the repository's documentation
              files would need to know? Check which of README.md, STATE.md, CHAIN.md,
              ARCHITECTURE.md exist in this repository first (use Glob or Read — do not
              assume any of them are present). For each that exists: is the relevant
              update in this diff? Also check for a requirement set directory. If so, is that
              update in this diff?
            - Is any figure or status in an updated document now stale because of this very
              diff? State the number the diff implies against the number written.
            - If the repository's CLAUDE.md sets a documentation register (for example
              Simplified Technical English), hold new prose to it.

            Report a missing or stale documentation update as issue (blocking).

            ## Part 3 - the verdict

            End the summary with two lines:
            1. The count of blocking findings, and whether you would merge. You do not
               merge and you do not approve; the line is for the human who does.
            2. A machine-readable trailer naming this PR's HEAD, copied **exactly** from
               the value below (do not run `git rev-parse`, do not shorten, do not invent
               a SHA — goal-bingo#50 showed the agent can emit a trailer that is not
               HEAD when left to discover it):
               `Reviewed-Commit: ${{ github.event.pull_request.head.sha }}`
               The next synchronize uses this for delta scope.

      # Package A: require a non-author comment created at or after RUN_STARTED_AT so
      # a failed re-run cannot go green on stale comments from an earlier round. Skip
      # this step when the job was cancelled by concurrency (superseded push).
      # Mechanical path posts as github-actions[bot], which is not the PR author.
      - name: A review was actually posted
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_STARTED_AT: ${{ env.RUN_STARTED_AT }}
        run: |
          set -e
          author=$(gh pr view "$PR" --json author -q .author.login)
          # gh -q does not accept jq --arg flags (they are parsed as gh flags).
          # Pipe JSON to jq so --arg works. Require a comment/review at or after
          # RUN_STARTED_AT by someone other than the PR author.
          others=$(gh pr view "$PR" --json reviews,comments | jq \
            --arg since "$RUN_STARTED_AT" --arg author "$author" \
            '[
              (.reviews[]? | select(.author.login != $author and .submittedAt >= $since)),
              (.comments[]? | select(.author.login != $author and .createdAt >= $since))
            ] | length')
          echo "reviews or comments by someone other than $author since $RUN_STARTED_AT: $others"
          if [ "$others" -eq 0 ]; then
            echo "The reviewer produced nothing in this run."
            echo "Check that this workflow has issues: write and pull-requests: write -"
            echo "a denied tool call does not fail the action on its own."
            exit 1
          fi
